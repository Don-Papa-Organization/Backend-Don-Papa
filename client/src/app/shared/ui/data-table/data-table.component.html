<section class="data-table-section">
  <h3 *ngIf="title">{{ title }}</h3>

  <div *ngIf="loading" class="state loading">Cargando...</div>

  <div *ngIf="error" class="state error">
    <p>{{ error }}</p>
    <button type="button" class="retry-btn" (click)="onRetry()">Reintentar</button>
  </div>

  <div *ngIf="!loading && !error && !rows.length" class="state empty">
    <p>{{ emptyMessage }}</p>
  </div>

  <div *ngIf="!loading && !error && rows.length" class="table-content">
    <table class="data-table" [style.minWidth]="minWidth">
      <thead>
        <tr>
          <th *ngFor="let col of columns">{{ col }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows">
          <td *ngFor="let col of columns">{{ row[col] ?? '-' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
