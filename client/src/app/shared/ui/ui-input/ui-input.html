<div class="input-container" [ngClass]="containerClasses">
  <label *ngIf="showLabel">{{ tituloInput }}</label>
  <input 
    class="ui-input-field"
    [placeholder]="placeholder"
    [type]="tipo"
    [value]="value"
    [disabled]="isDisabled"
    [min]="min"
    (input)="onInput($event)"
    (keyup.enter)="onEnterPressed()"
  />
</div>
