<div class="modal-backdrop" [class.modal-backdrop--client-premium]="tone === 'client-premium'" *ngIf="mostrar" (click)="onBackdropClick()">

    <div [ngClass]="containerClasses" [ngStyle]="containerStyles" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>{{ titulo }}</h3>
            <button class="cerrar-btn" type="button" (click)="onCerrar()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
        </div>


        <div class="modal-body">
            <ng-content></ng-content>
        </div>


        <div class="modal-footer">
            <ng-content select="[footer]"></ng-content>
        </div>
    </div>
</div>
