<div class="modal-backdrop" *ngIf="mostrar" (click)="onBackdropClick()">

    <div [ngClass]="containerClasses" [ngStyle]="containerStyles" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>{{ titulo }}</h3>
            <button class="cerrar-btn" type="button" (click)="onCerrar()">✕</button>
        </div>


        <div class="modal-body">
            <ng-content></ng-content>
        </div>


        <div class="modal-footer">
            <ng-content select="[footer]"></ng-content>
        </div>
    </div>
</div>
