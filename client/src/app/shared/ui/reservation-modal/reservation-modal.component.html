<div class="modal-overlay" (click)="onCerrar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Confirmar Reserva</h2>
      <button class="close-btn" (click)="onCerrar()" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group read-only">
        <label>Mesa</label>
        <div class="read-only-value">
          <span class="mesa-badge" [ngClass]="'mesa-' + mesa?.tipo?.toLowerCase()">
            #{{ mesa?.numero }} - {{ mesa?.tipo }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="fechaReserva">Fecha</label>
        <input
          type="date"
          id="fechaReserva"
          [(ngModel)]="fechaEditable"
          (ngModelChange)="onFechaChange()"
          [min]="minDate"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="horaInicio">Hora Inicio</label>
        <select
          id="horaInicio"
          [(ngModel)]="horaInicioEditable"
          (ngModelChange)="onHoraInicioChange()"
          class="form-input"
        >
          <option *ngFor="let h of horasInicioDisponibles" [value]="h">
            {{ h }}
          </option>
        </select>
        <small class="helper" *ngIf="horasInicioDisponibles.length === 0">No hay horas disponibles para la fecha seleccionada.</small>
      </div>

      <div class="form-group">
        <label for="cantidadPersonas">Cantidad de Personas</label>
        <select
          id="cantidadPersonas"
          [(ngModel)]="cantidadPersonas"
          (change)="onCantidadChange()"
          class="form-input"
        >
          <option *ngFor="let personas of personasOptions" [value]="personas">
            {{ personas }} {{ personas === 1 ? 'persona' : 'personas' }}
          </option>
        </select>
        <small *ngIf="mesa?.tipo === 'Barra'">(Máximo 1 persona en barra)</small>
        <small *ngIf="mesa?.tipo !== 'Barra'">(Máximo 4 personas)</small>
      </div>

      <div class="form-group">
        <label for="horaFin">Hora Fin</label>
        <select
          id="horaFin"
          [(ngModel)]="horaFin"
          class="form-input"
        >
          <option
            *ngFor="let opcion of horasDisponibles"
            [value]="opcion.hora"
            [disabled]="isHoraFinDisabled(opcion)"
            [ngClass]="getHoraFinClass(opcion)"
          >
            {{ opcion.hora }}
          </option>
        </select>
      </div>

      <div class="resumen">
        <div class="resumen-item">
          <span>Duración:</span>
          <strong>
            {{ horaInicioEditable }} - {{ horaFin }}
          </strong>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onCerrar()"
        [disabled]="confirmando"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="btn btn-primary"
        (click)="onConfirmar()"
        [disabled]="confirmando || !horaInicioEditable"
      >
        <span *ngIf="!confirmando">Confirmar Reserva</span>
        <span *ngIf="confirmando">Procesando...</span>
      </button>
    </div>
  </div>
</div>
