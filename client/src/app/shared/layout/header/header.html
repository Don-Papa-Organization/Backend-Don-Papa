<header
[ngClass]="{
            'opacity': opacidad,
            'header--client': mode === 'client',
            'header--employee': mode === 'employee',
            'header--admin': mode === 'admin'
        }"
>
    @if (icono) {
        <div class="headerIcons">
            <img src="./img/logoDonPapaMediano.png">
            <h1> {{ titulo }}</h1>
        </div>
        
    }
    <ng-content></ng-content>
</header>
