<nav class="breadcrumbs" aria-label="Navegación de rutas">
  <ol class="breadcrumbs__list">
    <li *ngFor="let item of displayItems; let last = last" class="breadcrumbs__item">
      <button
        *ngIf="!item.active"
        class="breadcrumbs__link"
        (click)="navigate(item)"
        [attr.aria-current]="last ? 'page' : null"
      >
        {{ item.label }}
      </button>
      <span *ngIf="item.active" class="breadcrumbs__active">
        {{ item.label }}
      </span>

      <span *ngIf="!last" class="breadcrumbs__separator" aria-hidden="true">∙</span>
    </li>
  </ol>
</nav>
