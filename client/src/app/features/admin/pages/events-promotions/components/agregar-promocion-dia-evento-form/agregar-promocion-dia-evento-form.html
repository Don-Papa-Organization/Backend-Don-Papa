<app-ui-modal titulo="Asociar Promoción al Día" [mostrar]="mostrar" (cerrar)="onCerrar()">
	<app-ui-form maxHeight="50vh" maxWidth="600px">
		<app-ui-combobox
			tituloInput="Seleccionar Promoción"
			[options]="promocionesOptions"
			[(selectedOption)]="promocionSeleccionadaId"
			name="promocion"
			required>
		</app-ui-combobox>

		<div footer class="form-footer">
			<ui-button texto="Asociar" (accion)="onSubmit()" [noBackgroundColor]="true"></ui-button>
		</div>
	</app-ui-form>
</app-ui-modal>
