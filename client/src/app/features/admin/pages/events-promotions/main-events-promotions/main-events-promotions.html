<div class="events-promotions-page">
	<!-- HEADER -->
	<div class="events-promotions-header">
		<h1>Eventos y Promociones</h1>
		<div class="acciones-header">
			<!-- BOTONES PARA PROMOCIONES -->
			<ng-container *ngIf="tabActiva === 'promociones'">
				<app-ui-only-icon-button texto="Promoción" urlIcono="icons/agregar.svg" (action)="onAgregarPromocion()"
					[showTextStyle]="true"></app-ui-only-icon-button>

				<app-ui-only-icon-button urlIcono="icons/reload.svg"
					(action)="cargarPromociones()"></app-ui-only-icon-button>
			</ng-container>

			<!-- BOTONES PARA EVENTOS -->
			<ng-container *ngIf="tabActiva === 'eventos'">
				<app-ui-only-icon-button texto="Evento" urlIcono="icons/agregar.svg" (action)="onAgregarEvento()"
					[showTextStyle]="true"></app-ui-only-icon-button>

				<app-ui-only-icon-button urlIcono="icons/reload.svg"
					(action)="cargarEventos()"></app-ui-only-icon-button>
			</ng-container>
		</div>
	</div>

	<app-ui-admin-filter-panel [estadoOpciones]="estadoOpciones" [mostrarFechas]="tabActiva === 'promociones'"
		[mostrarEstado]="tabActiva === 'promociones'"
		[labelBusqueda]="tabActiva === 'promociones' ? 'Buscar promociones' : 'Buscar eventos'"
		placeholderBusqueda="Nombre o descripción..." (filtrosAplicados)="onFiltrosAplicados($event)"
		(filtrosLimpiados)="onFiltrosLimpiados()">
	</app-ui-admin-filter-panel>

	<!-- TABS -->
	<app-ui-tabs [tabItems]="tabs" [tabActiva]="tabActiva" (tabChange)="cambiarTab($event)"></app-ui-tabs>

	<!-- CONTENIDO - TAB PROMOCIONES -->
	@if (tabActiva === 'promociones') {
	<!-- INDICADOR DE CARGA -->
	<div class="cargando" *ngIf="cargandoPromociones">
		<p>Cargando promociones...</p>
	</div>

	<div class="table-content" *ngIf="!cargandoPromociones">
		<app-ui-tabla [theadData]="columnasPromociones" [tbodyData]="promociones"
			[acciones]="accionesPromociones"></app-ui-tabla>
	</div>
	}

	<!-- CONTENIDO - TAB EVENTOS -->
	@if (tabActiva === 'eventos') {
	<!-- INDICADOR DE CARGA -->
	<div class="cargando" *ngIf="cargandoEventos">
		<p>Cargando eventos...</p>
	</div>

	<div class="table-content" *ngIf="!cargandoEventos">
		<app-ui-tabla [theadData]="columnasEventos" [tbodyData]="eventos" [acciones]="accionesEventos"></app-ui-tabla>
	</div>
	}

	<!-- ==================== MODALES PROMOCIONES ==================== -->

	<!-- AGREGAR PROMOCIÓN -->
	<app-agregar-promotion-form [mostrar]="mostrarModalAgregarPromocion" (cerrar)="mostrarModalAgregarPromocion = false"
		(promocionCreada)="onPromocionCreada($event)"></app-agregar-promotion-form>

	<!-- EDITAR PROMOCIÓN -->
	<app-editar-promotion-form [mostrar]="mostrarModalEditarPromocion" [promocionSeleccionada]="promocionSeleccionada"
		(cerrar)="mostrarModalEditarPromocion = false; promocionSeleccionada = null"
		(promocionActualizada)="onPromocionActualizada($event)"></app-editar-promotion-form>

	<!-- ELIMINAR PROMOCIÓN -->
	@if (mostrarModalEliminarPromocion) {
	<app-ui-modal titulo="Eliminar Promoción" [mostrar]="mostrarModalEliminarPromocion"
		(cerrar)="cerrarModalEliminarPromocion()">
		<div class="modal-confirmacion">

			<ui-button texto="Eliminar Promoción" backgroundColor="#EF4444" [noBackgroundColor]="true"
				(accion)="confirmarEliminacionPromocion()"></ui-button>

		</div>
	</app-ui-modal>
	}

	<!-- ==================== MODALES EVENTOS ==================== -->

	<!-- AGREGAR EVENTO -->
	<app-agregar-event-form [mostrar]="mostrarModalAgregarEvento" (cerrar)="mostrarModalAgregarEvento = false"
		(eventoCreado)="onEventoCreado($event)"></app-agregar-event-form>

	<!-- EDITAR EVENTO -->
	<app-editar-event-form [mostrar]="mostrarModalEditarEvento" [eventoSeleccionado]="eventoSeleccionado"
		(cerrar)="mostrarModalEditarEvento = false; eventoSeleccionado = null"
		(eventoActualizado)="onEventoActualizado($event)"></app-editar-event-form>

	<!-- ELIMINAR EVENTO -->
	@if (mostrarModalEliminarEvento) {
	<app-ui-modal titulo="Eliminar Evento" [mostrar]="mostrarModalEliminarEvento"
		(cerrar)="cerrarModalEliminarEvento()">
		<div class="modal-confirmacion">
			<ui-button texto="Eliminar Evento" backgroundColor="#EF4444" [noBackgroundColor]="true"
				(accion)="confirmarEliminacionEvento()"></ui-button>
		</div>
	</app-ui-modal>
	}

	<!-- ==================== MODALES ADICIONALES ==================== -->

	<!-- ==================== NUEVOS COMPONENTES ENCAPSULADOS ==================== -->

	<!-- GESTIONAR PRODUCTOS DE PROMOCIÓN -->
	<app-products-section [mostrar]="mostrarModalProductosPromocion" [promocionSeleccionada]="promocionSeleccionada"
		[productosPromocion]="productosPromocion" [productosDisponibles]="productosDisponibles"
		(cerrar)="mostrarModalProductosPromocion = false"
		(recargarPromocion)="onRecargarProductosDePromocion($event)"></app-products-section>

	<!-- GESTIONAR DÍAS DE EVENTO -->
	<app-days-section [mostrar]="mostrarModalDiasEvento" [eventoSeleccionado]="eventoSeleccionado"
		[diasEvento]="diasEvento" [promocionesDisponibles]="promocionesDisponibles"
		(cerrar)="mostrarModalDiasEvento = false" (recargarEvento)="onRecargarEvento($event)"></app-days-section>
</div>
