<div class="statistics-page">
  <!-- Header estandarizado -->
  <div class="statistics-header">
    <h1>Estadísticas</h1>
    <div class="acciones-header">
      <div class="download-menu" #downloadMenuContainer>
        <button class="download-chip" (click)="toggleDownloadMenu($event)">Descargar estadísticas</button>
        <div class="download-options" *ngIf="showDownloadMenu">
          <button type="button" (click)="onDownloadRange(7)">Últimos 7 días</button>
          <button type="button" (click)="onDownloadRange(30)">Últimos 30 días</button>
          <button type="button" (click)="onDownloadRange(90)">Últimos 3 meses</button>
        </div>
      </div>
      <app-ui-only-icon-button
        urlIcono="icons/reload.svg"
        (action)="loadDashboard()"
      ></app-ui-only-icon-button>
    </div>
  </div>

  <!-- Chips de filtros rápidos -->
  <div class="quick-filters">
    <button 
      class="chip" 
      [class.active]="isActiveFilter(quickFilter7Days)"
      (click)="setQuickFilter(7)"
    >
      Últimos 7 días
    </button>
    <button 
      class="chip" 
      [class.active]="isActiveFilter(quickFilter30Days)"
      (click)="setQuickFilter(30)"
    >
      Últimos 30 días
    </button>
    <button 
      class="chip" 
      [class.active]="isActiveFilter(quickFilter90Days)"
      (click)="setQuickFilter(90)"
    >
      Últimos 3 meses
    </button>
  </div>

  <!-- Tabs de navegación -->
  <app-ui-tabs
    [tabItems]="tabs"
    [tabActiva]="activeTab"
    (tabChange)="setActiveTab($event)"
  ></app-ui-tabs>

  <!-- Dashboard con secciones modulares por tabs -->
  <div class="dashboard-content">
    
    <!-- TAB VENTAS -->
    <div *ngIf="activeTab === 'ventas'" class="tab-content">
      <app-sales-section
        [loading]="salesLoading"
        [error]="salesError"
        [metrics]="salesMetrics"
        [timelineRows]="timelineRows"
        [weeklySalesLabels]="weeklySalesLabels"
        [weeklySalesData]="weeklySalesData"
        [weeklyComparisonLabels]="weeklyComparisonLabels"
        [weeklyCurrentData]="weeklyCurrentData"
        [weeklyPreviousData]="weeklyPreviousData"
        [currentWeekLabel]="'Semana Actual'"
        [previousWeekLabel]="'Semana Anterior'"
        [ventasFisico]="ventasFisico"
        [ventasWeb]="ventasWeb"
      ></app-sales-section>
    </div>

    <!-- TAB INVENTARIO -->
    <div *ngIf="activeTab === 'inventario'" class="tab-content">
      <app-inventory-section
        [topProductsLoading]="inventoryLoading"
        [topProductsError]="inventoryError"
        [topProductsRows]="topProductsRows"
        [deadStockLoading]="inventoryLoading"
        [deadStockError]="inventoryError"
        [deadStockRows]="deadStockRows"
        [top5Labels]="top5Labels"
        [top5Data]="top5Data"
        [top3ProductsWithComparison]="top3ProductsWithComparison"
        [totalSales]="totalSales"
      ></app-inventory-section>
    </div>

    <!-- TAB USUARIOS -->
    <div *ngIf="activeTab === 'usuarios'" class="tab-content">
      <app-user-occupancy-section
        [userGrowthLoading]="usersLoading"
        [userGrowthError]="usersError"
        [userMetrics]="userMetrics"
      ></app-user-occupancy-section>

      <app-misc-metrics-section
        [promotionsLoading]="usersLoading"
        [promotionsError]="usersError"
        [promotionsRows]="promotionsRows"
        [frequentUsersLoading]="usersLoading"
        [frequentUsersError]="usersError"
        [frequentUsersRows]="frequentUsersRows"
      ></app-misc-metrics-section>
    </div>

    <!-- TAB OCUPACIÓN -->
    <div *ngIf="activeTab === 'ocupacion'" class="tab-content">
      <!-- Métricas de Ocupación - PRIMERO -->
      <div class="occupancy-metrics-card">
        <h3>Métricas de Ocupación</h3>
        <div class="metrics-grid">
          <div class="metric-item highlight">
            <span class="metric-label">Tasa No-Show</span>
            <span class="metric-value danger">{{ noShowRate }}</span>
          </div>
          <div class="metric-item highlight">
            <span class="metric-label">Hora Pico</span>
            <span class="metric-value">{{ peakHour }}</span>
          </div>
          <div class="metric-item highlight">
            <span class="metric-label">Reservas Totales</span>
            <span class="metric-value">{{ totalReservations }}</span>
          </div>
        </div>
      </div>

      <!-- Gráfico de Horas Pico - SEGUNDO -->
      <div class="chart-section">
        <app-statistics-chart
          title="Reservas por Hora del Día"
          type="bar"
          [labels]="occupancyChartLabels"
          [data]="occupancyChartData"
          label="Reservas"
          [loading]="occupancyLoading"
          [error]="occupancyError"
          [height]="250"
        ></app-statistics-chart>
      </div>
    </div>

  </div>
</div>
