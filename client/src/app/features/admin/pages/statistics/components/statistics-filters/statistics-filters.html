<div class="statistics-header">
  <div>
    <h2>Panel de Estadísticas</h2>
    <p class="subtitle">Análisis completo de ventas, inventario, usuarios y ocupación</p>
  </div>

  <div class="acciones-header">
    <ui-button
      texto="Descargar PDF"
      [noBackgroundColor]="true"
      (accion)="downloadPdf.emit()"
    ></ui-button>
    <ui-button
      texto="Descargar JSON"
      [noBackgroundColor]="true"
      (accion)="downloadJson.emit()"
    ></ui-button>
  </div>
</div>
