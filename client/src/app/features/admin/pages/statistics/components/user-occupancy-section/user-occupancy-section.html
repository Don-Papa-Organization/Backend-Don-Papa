<div class="user-occupancy-wrapper">
  <app-statistics-metrics-grid
    title="Crecimiento de Usuarios"
    [loading]="userGrowthLoading"
    [error]="userGrowthError"
    [metrics]="userMetrics"
  ></app-statistics-metrics-grid>

  <app-statistics-data-table
    title="Horas Pico"
    [loading]="occupancyLoading"
    [error]="occupancyError"
    [columns]="['Hora', 'Reservas']"
    [rows]="occupancyRows"
  ></app-statistics-data-table>
</div>
