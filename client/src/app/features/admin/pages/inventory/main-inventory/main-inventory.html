<div class="inventory-page">
    <div class="inventory-header">
        <h1 class="inventory-title">Productos</h1>
        <div class="buttons">
            <app-ui-only-icon-button texto="Producto" urlIcono="icons/agregar.svg" [showTextStyle]="showTextStyle"
                (action)="onAgregar()">
            </app-ui-only-icon-button>


            <app-ui-only-icon-button texto="Categoria" urlIcono="icons/agregar.svg" [showTextStyle]="true"
                (action)="onAgregarCategoria()">
            </app-ui-only-icon-button>

            <app-ui-only-icon-button texto="Categoria" urlIcono="icons/editar.svg" [showTextStyle]="true"
                (action)="onEditarCategoria()">
            </app-ui-only-icon-button>

            <app-ui-only-icon-button urlIcono="icons/reload.svg" (action)="cargarProductos()">

            </app-ui-only-icon-button>
        </div>



    </div>

    <app-ui-admin-filter-panel [estadoOpciones]="categoriasOptions" [mostrarFechas]="false" [mostrarEstado]="true"
        labelBusqueda="Buscar productos" placeholderBusqueda="Nombre o descripción..." tituloInput="Categorias"
        (filtrosAplicados)="onFiltrosAplicados($event)" (filtrosLimpiados)="onFiltrosLimpiados()">
    </app-ui-admin-filter-panel>

    <!-- INDICADOR DE CARGA -->
    <div class="cargando" *ngIf="cargandoProductos">
        <p>Cargando productos...</p>
    </div>

    <div class="table-content" *ngIf="!cargandoProductos">
        <app-ui-tabla name="table-content" [theadData]="columnas" [tbodyData]="productosTableData"
            [columnasConfig]="columnasConfig"
            (editarRegistro)="onEditar($event)"
            (eliminarRegistro)="onEliminar($event)"
            (stepperChange)="onStepperStockChange($event)"
            (toggleChange)="onToggleActivoChange($event)">
        </app-ui-tabla>
    </div>

    <div class="paginacion" *ngIf="!cargandoProductos && totalItems > 0">
        <div class="paginacion-info">
            <span>Total: {{ totalItems }} productos</span>
            <span>Pagina {{ currentPage }} de {{ totalPages }}</span>
        </div>

        <div class="paginacion-controles">
            <app-ui-combobox
                tituloInput="Items por pagina"
                [options]="pageSizeOptions"
                [(selectedOption)]="pageSize"
                (selectedOptionChange)="onPageSizeChange($event)">
            </app-ui-combobox>

            <ui-button
                texto="Anterior"
                [noBackgroundColor]="true"
                [disabled]="currentPage <= 1 || cargandoProductos"
                (accion)="previousPage()">
            </ui-button>

            <ui-button
                texto="Siguiente"
                [noBackgroundColor]="true"
                [disabled]="currentPage >= totalPages || cargandoProductos"
                (accion)="nextPage()">
            </ui-button>
        </div>
    </div>



    <app-ui-modal titulo="¿Desea eliminar producto?" [mostrar]="mostrarModalEliminar" (cerrar)="cerrarModalEliminar()">
        <ui-button texto="Eliminar Producto" [noBackgroundColor]="true" [backgroundColor]="'#EF4444'"
            (accion)="eliminarProducto()"></ui-button>
    </app-ui-modal>

    <app-agregar-form [mostrar]="mostrarModalAgregar" [categoriasOptions]="categoriasOptions"
        [showTextStyle]="showTextStyle" (cerrar)="cerrarModalAgregar()" (productoCreado)="onProductoCreado($event)">
    </app-agregar-form>

    <app-editar-form [mostrar]="mostrarModalEditar" [categoriasOptions]="categoriasOptions"
        [showTextStyle]="showTextStyle" [registroSeleccionado]="registroSeleccionado" (cerrar)="cerrarModalEditar()"
        (productoActualizado)="onProductoActualizado($event)">
    </app-editar-form>

    <!-- Modal Agregar Categoria -->
    <app-ui-modal titulo="Agregar Categoría" [mostrar]="mostrarModalAgregarCategoria"
        (cerrar)="cerrarModalAgregarCategoria()">
        <app-ui-form maxHeight="50vh" maxWidth="600px">
            <ui-input tituloInput="Nombre Categoría" [(ngModel)]="nuevaCategoriaNombre" name="nuevaCategoriaNombre"
                placeholder="Ej: Bebidas, Postres, etc.">
            </ui-input>
            <div footer>
                <ui-button [noBackgroundColor]="true" texto="Guardar" (accion)="guardarCategoria()"></ui-button>
            </div>
        </app-ui-form>
    </app-ui-modal>

    <!-- Modal Editar/Eliminar Categoria -->
    <app-ui-modal titulo="Gestionar Categoría" [mostrar]="mostrarModalEditarCategoria"
        (cerrar)="cerrarModalEditarCategoria()">
        <app-ui-form maxHeight="50vh" maxWidth="600px">
            <app-ui-combobox tituloInput="Seleccionar Categoría" [options]="categoriasOptions"
                [(selectedOption)]="categoriaSeleccionadaId">
            </app-ui-combobox>

            <ui-input tituloInput="Nuevo Nombre (Opcional)" [(ngModel)]="categoriaNombreEditado"
                name="categoriaNombreEditado" placeholder="Ej: Refrescos">
            </ui-input>

            <div footer style="display: flex; gap: 10px; justify-content: flex-end;">
                <ui-button texto="Eliminar" [noBackgroundColor]="true" [backgroundColor]="'#EF4444'"
                    (accion)="eliminarCategoria()" [disabled]="!categoriaSeleccionadaId || !!categoriaNombreEditado">
                </ui-button>
                <ui-button texto="Actualizar" [noBackgroundColor]="true" (accion)="actualizarCategoria()"
                    [disabled]="!categoriaSeleccionadaId || !categoriaNombreEditado">
                </ui-button>
            </div>
        </app-ui-form>
    </app-ui-modal>
</div>
