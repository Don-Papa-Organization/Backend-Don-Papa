<app-ui-modal
	[mostrar]="mostrar"
	titulo="Editar Método de Pago"
	(cerrar)="onCerrar()"
>
	<app-ui-form maxHeight="50vh" maxWidth="600px">
		<ui-input
			tituloInput="Nombre"
			tipo="text"
			placeholder="Transferencia"
			[(ngModel)]="nombre"
			name="nombre"
			required
			#nombreModel="ngModel"
		></ui-input>

		<div footer class="form-footer">
			<ui-button
				texto="Actualizar"
				[noBackgroundColor]="true"
				backgroundColor="#D4AF37"
				(accion)="onGuardar()"
			></ui-button>
		</div>

		<app-ui-helper-text *ngIf="nombreModel.invalid && (nombreModel.touched || formSubmitted)">
			<ng-container *ngIf="nombreModel.errors?.['required']">El nombre es obligatorio.</ng-container>
		</app-ui-helper-text>
	</app-ui-form>
</app-ui-modal>
