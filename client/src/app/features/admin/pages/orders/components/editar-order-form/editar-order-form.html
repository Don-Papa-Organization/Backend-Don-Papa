<app-ui-modal
	[mostrar]="mostrar"
	titulo="Actualizar Pedido"
	(cerrar)="onCerrar()"
>
	<app-ui-form maxHeight="50vh" maxWidth="1000px">
		<!-- ID Pedido (solo lectura) -->
		<ui-input
			tituloInput="ID Pedido"
			tipo="number"
			[ngModel]="pedidoEditado.idPedido"
			name="idPedido"
			disabled
		></ui-input>

		<!-- Estado -->
		<app-ui-combobox
			tituloInput="Estado del Pedido"
			[options]="estadosDisponibles"
			[(selectedOption)]="pedidoEditado.estado"
		></app-ui-combobox>

		<app-ui-helper-text *ngIf="formSubmitted && !pedidoEditado.estado">
			<ng-container>El estado es obligatorio.</ng-container>
		</app-ui-helper-text>

		<!-- Total (solo lectura) -->
		<ui-input
			tituloInput="Total"
			tipo="number"
			[ngModel]="pedidoEditado.total"
			name="total"
			disabled
		></ui-input>

		<!-- Dirección de Entrega -->
		<ui-input
			tituloInput="Dirección de Entrega"
			tipo="text"
			placeholder="Calle Principal 123"
			[(ngModel)]="pedidoEditado.direccionEntrega"
			name="direccionEntrega"
		></ui-input>

		<!-- Footer -->
		<div footer class="form-footer">
			<ui-button
				texto="Actualizar Pedido"
				[noBackgroundColor]="true"
				backgroundColor="#D4AF37"
				(accion)="onGuardar()"
			></ui-button>
		</div>
	</app-ui-form>
</app-ui-modal>
