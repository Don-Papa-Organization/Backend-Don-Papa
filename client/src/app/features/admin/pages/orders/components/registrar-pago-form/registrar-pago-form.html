<app-ui-modal
	[mostrar]="mostrar"
	titulo="Registrar Pago"
	(cerrar)="onCerrar()"
>
	<app-ui-form maxHeight="50vh" maxWidth="700px">
		<app-ui-combobox
			tituloInput="Método de Pago"
			[options]="metodosPagoOptions"
			[(selectedOption)]="idMetodoPago"
		></app-ui-combobox>

		<ui-input
			tituloInput="Dirección de Entrega (Opcional)"
			tipo="text"
			placeholder="Av. Siempre Viva 742"
			[(ngModel)]="direccionEntrega"
			name="direccionEntrega"
		></ui-input>

		<div footer class="form-footer">
			<ui-button
				texto="Registrar Pago"
				[noBackgroundColor]="true"
				backgroundColor="#D4AF37"
				(accion)="onGuardar()"
			></ui-button>
		</div>

		<app-ui-helper-text *ngIf="formSubmitted && !idMetodoPago">
			<ng-container>Debe seleccionar un método de pago.</ng-container>
		</app-ui-helper-text>
	</app-ui-form>
</app-ui-modal>
